# Place this file at /etc/nginx/sites-available/gpt.d-scribe.ru
# then: ln -s /etc/nginx/sites-available/gpt.d-scribe.ru /etc/nginx/sites-enabled/
# then: certbot --nginx -d gpt.d-scribe.ru
# certbot will add the ssl_certificate / ssl_certificate_key lines automatically.

server {
    listen 80;
    server_name gpt.d-scribe.ru;

    location /gpt {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host              $host;
    }
}
